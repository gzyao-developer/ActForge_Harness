scene_id: coupling_v1
description: "单桌面：接箍 + 抹布 + 测量尺，用于内壁擦拭与内径测量"

table:
  z: 0.0
  x_min: -0.5
  x_max: 0.5
  y_min: -0.5
  y_max: 0.5

robot:
  ee_pose: { x: 0.0, y: -0.35, z: 0.28, yaw: 0.0 }
  gripper: open
  holding: null

objects:
  - id: coupling
    label: coupling
    display_name: 接箍
    shape: ring
    xyz: { x: 0.12, y: 0.05, z: 0.04 }
    yaw: 0.0
    radius: 0.06
    inner_radius: 0.045
    height: 0.08
    graspable: false

  - id: rag
    label: rag
    display_name: 抹布
    shape: box
    xyz: { x: 0.28, y: 0.05, z: 0.01 }
    yaw: 0.0
    size: { x: 0.08, y: 0.06, z: 0.02 }
    radius: 0.04
    height: 0.02
    graspable: true

  - id: ruler
    label: ruler
    display_name: 测量尺
    shape: box
    xyz: { x: 0.28, y: -0.12, z: 0.01 }
    yaw: 0.2
    size: { x: 0.18, y: 0.02, z: 0.01 }
    radius: 0.05
    height: 0.01
    graspable: true

grasp:
  xy_tolerance: 0.05
  z_tolerance: 0.08
  lift_after_grasp: 0.08

motion:
  default_z_offset: 0.12
  step_sleep_sec: 0.0

# 接箍任务语义参数
coupling:
  wipe_xy_tolerance: 0.10
  measure_xy_tolerance: 0.10
  nominal_inner_diameter_mm: 90.0
