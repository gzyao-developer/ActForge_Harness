[project]
name = "actforge"
version = "0.1.0"
description = "ActForge Harness — embodied pick-can simulation with Skillbook & Recall"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2",
  "pyyaml>=6",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
pybullet = ["pybullet>=3.2.6"]
sim = ["pybullet>=3.2.6"]


[project.scripts]
actforge = "actforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/actforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
